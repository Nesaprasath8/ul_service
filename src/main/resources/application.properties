# All actual config values live in application-local.properties
# (git-ignored - see .gitignore). This file intentionally stays close
# to empty and must NOT gain real values here, since this one IS
# committed to git.
#
# spring.profiles.active has to stay in THIS file specifically: Spring
# Boot needs to read it from the base application.properties before it
# knows to go load application-local.properties at all - it can't live
# inside the file it's responsible for activating.
#
# First time setup: create src/main/resources/application-local.properties
# with spring.datasource.url, spring.datasource.username,
# spring.datasource.password, spring.datasource.driver-class-name, and
# jwt.secret. A CI/CD or production environment should instead override
# spring.profiles.active (e.g. SPRING_PROFILES_ACTIVE=prod as a real
# environment variable) and supply those same values as real environment
# variables rather than any committed or local properties file.
spring.profiles.active=local
